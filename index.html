<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Using APIs to POST GET & DELETE</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  </head>
  <body>
    <div class="container-fluid nav">
        <div class="container nav-con">
            <div class="content1">
                <a href="" role="button" class="tab-button" data-tab="tab1">POST</a>
                <a href="" role="button" class="tab-button" data-tab="tab2">GET & DELETE</a>
            </div>
        </div>
    </div>
    <div class="container-fluid tab-content active first" id="tab1" >
        <div class="container container1">
            <div class="content2">
                <h1>STUDENT FORM</h1>
                <form action="" id="createStudent">
                    <div class="inputs">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" >
                    </div>
                    <div class="inputs">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname">
                    </div>
                    <div class="inputs">
                        <label for="email">Email</label>
                        <input type="email" id="email">
                    </div>
                    <div class="inputs">
                        <label for="date">Date of birth</label>
                        <input type="date" id="date">
                    </div>
                    <div class="inputs">
                        <label for="password">Password</label>
                        <input type="text" id="password">
                    </div>
                    <div class="inputs">
                        <label for="confirmPassword">Confirm Password </label>
                        <input type="text" id="confirmPassword">
                    </div>
                    <div class="inputs">
                        <input type="submit" disabled>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="container-fluid tab-content second" id="tab2">
        <div class="container container2">
            <div class="content3">
                <div class="add-table">
                        <div class="grid">
                    <table>
                    <tr>
                        <th>ID</th>
                        <th>Date Created </th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Date of Birth</th>
                    </tr>
                </table>
                </div>
                <button id="displayBtn">Display Users</button>
                </div>
                <div class="container container3">
                    <form id="deleteStudent" class="delete ">
                    <h4>Delete Student </h4>
                    <div class="inputs">
                        <label for="">Student's ID</label>
                        <input type="text" id="student_id" placeholder="Enter Student's ID">
                    </div>
                        <input type="submit">
                </form>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
    <script src="delete.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  </body>
</html>
